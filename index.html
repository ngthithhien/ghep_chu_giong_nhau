
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bé chọn đúng số lượng</title>

<style>
:root {
  --ink:#24458b;
  --pink:#ff5c9a;
  --blue:#38a8e8;
  --green:#53bb72;
  --purple:#a779e8;
  --orange:#ffb83e;
}

* { box-sizing:border-box; }

body {
  margin:0;
  font-family:"Trebuchet MS",Arial,sans-serif;
  color:var(--ink);
  background:linear-gradient(
    #8be0ff 0%,#e4faff 52%,
    #dff8a9 52%,#b8ee83 100%
  );
  min-height:100vh;
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}

button { font:inherit; cursor:pointer; }

.game {
  max-width:1400px;
  margin:auto;
  padding:clamp(10px,2vw,24px);
  position:relative;
  padding-top:76px;
}

.top {
  display:grid;
  grid-template-columns:1fr minmax(150px,250px) 1fr;
  gap:12px;
  align-items:center;
}

.target {
  background:#fff;
  border:5px solid #ffbf2f;
  border-radius:25px;
  text-align:center;
  padding:5px 8px;
  box-shadow:0 5px 0 #e8a31e;
  width:100%;
  max-width:250px;
  justify-self:center;
}

.target small {
  display:block;
  font-size:clamp(12px,1.2vw,16px);
  font-weight:800;
}

#targetNumber {
  font-size:clamp(62px,7vw,90px);
  line-height:1;
  font-weight:900;
  color:#3551bd;
  text-shadow:2px 3px #d5ddff;
}

.mascot {
  font-size:clamp(42px,6vw,78px);
  text-align:center;
  filter:drop-shadow(0 4px 0 #ffffff80);
}

.top-controls {
  position:absolute;
  right:clamp(10px,2vw,24px);
  top:10px;
  display:flex;
  gap:8px;
  z-index:2;
}

.top-controls .action {
  font-size:clamp(13px,1.4vw,17px);
  padding:9px 15px;
}

.status {
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  margin:12px 0 10px;
  font-size:clamp(15px,1.6vw,20px);
  font-weight:800;
}

.pill {
  background:#fff;
  border:2px solid #ccefff;
  border-radius:999px;
  padding:8px 16px;
  box-shadow:0 3px 0 #b6dfef;
}

#feedback {
  min-height:38px;
  text-align:center;
  font-size:clamp(20px,2.4vw,30px);
  font-weight:900;
  color:#e64b88;
  margin:8px 0 14px;
}

.cards {
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:clamp(7px,1.2vw,16px);
  align-items:stretch;
}

.card {
  min-width:0;
  min-height:clamp(190px,25vw,310px);
  background:#fffdfb;
  border:5px solid var(--border);
  border-radius:26px;
  padding:clamp(6px,1vw,14px);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  box-shadow:0 5px 0 color-mix(in srgb,var(--border),white 35%);
  transition:transform .15s,box-shadow .15s;
  position:relative;
  overflow:hidden;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

.card:hover { transform:translateY(-4px); }

.card:focus-visible {
  outline:5px solid #263e9a;
  outline-offset:3px;
}

.card.correct {
  background:#e9ffec;
  border-color:#22b75a;
  box-shadow:0 0 0 5px #a4efb5;
}

.card.wrong {
  background:#fff0f1;
  border-color:#ff5367;
  animation:shake .25s linear 2;
}

.card:disabled { cursor:default; }

.objects {
  width:100%;
  max-width:100%;
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  align-content:center;
  justify-items:center;
  align-items:center;
  gap:clamp(3px,.7vw,9px);
  flex:1;
  min-height:0;
}

.object {
  font-size:clamp(22px,3.4vw,48px);
  line-height:1.05;
  max-width:100%;
  display:block;
  text-align:center;
  filter:drop-shadow(0 2px 0 #0000000b);
  user-select:none;
  -webkit-user-select:none;
}

/* Không hiển thị nhãn chữ trong các khung */
.card-label {
  display:none;
}

.bottom { display:none; }

.action {
  border:0;
  border-radius:999px;
  padding:13px 25px;
  font-size:clamp(17px,1.8vw,22px);
  font-weight:900;
  color:white;
  background:var(--pink);
  box-shadow:0 5px 0 #d83e78;
}

.action.secondary {
  background:#4a9ce8;
  box-shadow:0 5px 0 #2674bb;
}

.action:active {
  transform:translateY(3px);
  box-shadow:0 2px 0 #b33c70;
}

.footer {
  text-align:center;
  font-size:14px;
  color:#32634d;
  font-weight:700;
  margin:16px 0;
}

.overlay {
  position:fixed;
  inset:0;
  background:#16315bbd;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  z-index:5;
}

.overlay.show { display:flex; }

.modal {
  max-width:500px;
  width:100%;
  background:#fffdf5;
  border:6px solid #ffca4d;
  border-radius:32px;
  padding:28px;
  text-align:center;
  box-shadow:0 10px 0 #bb8a25;
}

.modal h2 {
  font-size:clamp(28px,5vw,42px);
  margin:5px 0;
  color:#e84d8a;
}

.modal p {
  font-size:22px;
  font-weight:800;
}

@keyframes shake {
  25% { transform:translateX(-5px); }
  75% { transform:translateX(5px); }
}

@media(max-width:760px) {
  .game { padding:70px 10px 14px; }

  
.top {
  grid-template-columns:minmax(0,1fr) minmax(130px,200px);
  gap:9px;
}

.target {
  grid-column:2;
  grid-row:1;
  border-width:4px;
  border-radius:20px;
  max-width:200px;
  min-height:120px;
  padding:8px;
}

#targetNumber {
  font-size:clamp(64px,9vw,82px);
}

  .cards {
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:10px;
  }

  .card:last-child {
    grid-column:1/-1;
    min-height:150px;
  }

  .object { font-size:clamp(25px,7vw,42px); }

  .card {
    min-height:170px;
    border-width:4px;
    border-radius:20px;
  }

  .objects { max-width:100%; gap:5px; }

  .card-label {
    font-size:12px;
    padding:5px 10px;
  }

  .top-controls { top:8px; right:10px; }

  .top-controls .action {
    padding:8px 11px;
    font-size:13px;
  }

  .status { margin:10px 0 6px; }
  .footer { margin:12px 0; }
}

@media(max-width:390px) {
  .game { padding-left:7px; padding-right:7px; }
  .cards { gap:7px; }

  .card {
    padding:6px;
    min-height:148px;
    border-width:3px;
  }

  .object { font-size:clamp(22px,7vw,29px); }
  .objects { gap:3px; }
  .target { padding:5px; }
  .mascot { font-size:40px; }

  .top-controls .action {
    padding:7px 9px;
  }
}
</style>
</head>

<body>
<main class="game">

  <div class="top-controls">
    <button class="action secondary" id="repeatBtn" type="button">
      🔄 Chơi lại
    </button>
    <button class="action" id="nextBtn" type="button" hidden>
      Câu tiếp ➜
    </button>
  </div>

  <section class="top">
    <div class="mascot" aria-hidden="true">🐝🌼</div>

    <div class="target">
      <small>BÉ TÌM SỐ LƯỢNG</small>
      <div id="targetNumber">5</div>
    </div>

    <div class="mascot" aria-hidden="true">🌈⭐</div>
  </section>

  <section class="status">
    <span class="pill" id="roundText">Câu 1 / 5</span>
    <span class="pill">⭐ Điểm: <span id="score">0</span></span>
  </section>

  <div id="feedback" role="status" aria-live="polite">
    Con quan sát thật kỹ nhé!
  </div>

  <section class="cards" id="cards"
           aria-label="Năm khung hình để lựa chọn">
  </section>

  <div class="footer">
    🌻 Bé thật giỏi – Bé chọn thật đúng! 🌻
  </div>

</main>

<div class="overlay" id="finishOverlay"
     role="dialog" aria-modal="true"
     aria-labelledby="finishTitle">

  <div class="modal">
    <div style="font-size:68px">🏆🎉</div>
    <h2 id="finishTitle">Hoan hô!</h2>
    <p id="finishText">Con đã hoàn thành trò chơi!</p>
    <button class="action" id="againBtn" type="button">
      Chơi lại nào! 🔄
    </button>
  </div>
</div>

<script>
const palettes = [
  {border:"#ff5c91", emoji:"🍎"},
  {border:"#3aa8e8", emoji:"⭐"},
  {border:"#54bd72", emoji:"🐠"},
  {border:"#a779e8", emoji:"🌸"},
  {border:"#ffb83e", emoji:"🦋"}
];

let rounds = [];
let roundIndex = 0;
let score = 0;
let locked = false;

const $ = id => document.getElementById(id);

/* Tệp âm thanh đặt cùng thư mục với HTML */
const soundWin = new Audio("win.mp3");
const soundWrong = new Audio("sai.mp3");

soundWin.preload = "auto";
soundWrong.preload = "auto";

function playSound(audio) {
  audio.pause();
  audio.currentTime = 0;

  const result = audio.play();

  if (result && typeof result.catch === "function") {
    result.catch(error => {
      console.warn("Không phát được âm thanh:", error);
    });
  }
}

function shuffle(arr) {
  const a = [...arr];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
}

function makeRounds() {
  const targets = shuffle([3, 4, 5, 6, 7]);

  rounds = targets.map(target => ({
    target,
    counts: shuffle([3, 4, 5, 6, 7])
  }));
}

function renderRound() {
  locked = false;

  const r = rounds[roundIndex];

  $("targetNumber").textContent = r.target;
  $("roundText").textContent =
    `Câu ${roundIndex + 1} / ${rounds.length}`;
  $("score").textContent = score;

  $("feedback").textContent = "Con quan sát thật kỹ nhé!";
  $("feedback").style.color = "#e64b88";
  $("nextBtn").hidden = true;

  const cards = $("cards");
  cards.innerHTML = "";

  const cardPalettes = shuffle(palettes);

  r.counts.forEach((count, i) => {
    const p = cardPalettes[i];

    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "card";
    btn.style.setProperty("--border", p.border);
    btn.setAttribute(
      "aria-label",
      `Khung ${i + 1}, có ${count} hình`
    );

    const objects = document.createElement("div");
    objects.className = "objects";

    for (let k = 0; k < count; k++) {
      const span = document.createElement("span");
      span.className = "object";
      span.textContent = p.emoji;
      span.setAttribute("aria-hidden", "true");
      objects.appendChild(span);
    }

    btn.appendChild(objects);

    btn.addEventListener("click", () => {
      choose(btn, count, r.target);
    });

    cards.appendChild(btn);
  });
}

function choose(btn, count, target) {
  if (locked) return;

  if (count === target) {
    playSound(soundWin);

    locked = true;
    score++;

    btn.classList.add("correct");

    $("feedback").textContent = "🎉 Chính xác! Con giỏi quá!";
    $("feedback").style.color = "#159447";

    [...$("cards").children].forEach(card => {
      card.disabled = true;
    });

    $("score").textContent = score;

    if (roundIndex < rounds.length - 1) {
      $("nextBtn").hidden = false;
    } else {
      setTimeout(showFinish, 650);
    }

  } else {
    playSound(soundWrong);

    btn.classList.remove("wrong");
    void btn.offsetWidth;
    btn.classList.add("wrong");

    $("feedback").textContent =
      "😊 Chưa đúng rồi, con thử lại nhé!";
    $("feedback").style.color = "#e34a5d";

    setTimeout(() => {
      btn.classList.remove("wrong");
    }, 650);
  }
}

function showFinish() {
  $("finishText").textContent =
    `Con trả lời đúng ${score} / ${rounds.length} câu. ` +
    (score === 5
      ? "Tuyệt vời! Con là nhà toán học nhí!"
      : "Cố gắng thêm nhé, mình cùng chơi lại nào!");

  $("finishOverlay").classList.add("show");
}

function startGame() {
  rounds = [];
  roundIndex = 0;
  score = 0;

  $("finishOverlay").classList.remove("show");

  makeRounds();
  renderRound();
}

$("nextBtn").addEventListener("click", () => {
  if (roundIndex < rounds.length - 1) {
    roundIndex++;
    renderRound();
  }
});

$("repeatBtn").addEventListener("click", startGame);
$("againBtn").addEventListener("click", startGame);

startGame();
</script>
</body>
</html>
